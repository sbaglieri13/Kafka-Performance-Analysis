services:
  broker_1:
    image: confluentinc/cp-kafka:7.6.1
    container_name: broker_1
    hostname: broker_1
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1 # identificatore numerico del nodo nel cluster KRaft
      KAFKA_PROCESS_ROLES: "broker,controller" # ruoli del nodo
      KAFKA_CONTROLLER_QUORUM_VOTERS: "1@broker_1:29093,2@broker_2:29093,3@broker_3:29093"
      KAFKA_LISTENERS: "PLAINTEXT://0.0.0.0:29092,PLAINTEXT_HOST://0.0.0.0:9092,CONTROLLER://0.0.0.0:29093" # PLAINTEXT per i client (producer/consumer), CONTROLLER per la comunicazione interna del cluster
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: "PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT,CONTROLLER:PLAINTEXT"
      KAFKA_ADVERTISED_LISTENERS: "PLAINTEXT://broker_1:29092,PLAINTEXT_HOST://localhost:9092" # indirizzo che i client useranno per connettersi
      KAFKA_CONTROLLER_LISTENER_NAMES: "CONTROLLER" # specifica quale listener è usato per il ruolo di controller
      KAFKA_INTER_BROKER_LISTENER_NAME: "PLAINTEXT" # specifica quale listener è usato per la comunicazione tra broker
      # parametri per il controllo dei topic interni di Kafka
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 3
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 3
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 2 # minimo numero di repliche in sync
      CLUSTER_ID: "abcdefghijklmnopqrstuv" # identificatore univoco del cluster KRaft
    restart: unless-stopped # il broker si riavvia automaticamente se si arresta in modo anomalo
  
  broker_2:
    image: confluentinc/cp-kafka:7.6.1
    container_name: broker_2
    hostname: broker_2
    ports:
      - "9093:9093"
    environment:
      KAFKA_NODE_ID: 2 # identificatore numerico del nodo nel cluster KRaft
      KAFKA_PROCESS_ROLES: "broker,controller" # ruoli del nodo
      KAFKA_CONTROLLER_QUORUM_VOTERS: "1@broker_1:29093,2@broker_2:29093,3@broker_3:29093"
      KAFKA_LISTENERS: "PLAINTEXT://0.0.0.0:29092,PLAINTEXT_HOST://0.0.0.0:9093,CONTROLLER://0.0.0.0:29093" # PLAINTEXT per i client (producer/consumer), CONTROLLER per la comunicazione interna del cluster
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: "PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT,CONTROLLER:PLAINTEXT"
      KAFKA_ADVERTISED_LISTENERS: "PLAINTEXT://broker_2:29092,PLAINTEXT_HOST://localhost:9093" # indirizzo che i client useranno per connettersi
      KAFKA_CONTROLLER_LISTENER_NAMES: "CONTROLLER" # specifica quale listener è usato per il ruolo di controller
      KAFKA_INTER_BROKER_LISTENER_NAME: "PLAINTEXT" # specifica quale listener è usato per la comunicazione tra broker
      # parametri per il controllo dei topic interni di Kafka
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 3
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 3
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 2 # minimo numero di repliche in sync
      CLUSTER_ID: "abcdefghijklmnopqrstuv" # identificatore univoco del cluster KRaft
    restart: unless-stopped # il broker si riavvia automaticamente se si arresta in modo anomalo

  broker_3:
    image: confluentinc/cp-kafka:7.6.1
    container_name: broker_3
    hostname: broker_3
    ports:
      - "9094:9094"
    environment:
      KAFKA_NODE_ID: 3 # identificatore numerico del nodo nel cluster KRaft
      KAFKA_PROCESS_ROLES: "broker,controller" # ruoli del nodo
      KAFKA_CONTROLLER_QUORUM_VOTERS: "1@broker_1:29093,2@broker_2:29093,3@broker_3:29093"
      KAFKA_LISTENERS: "PLAINTEXT://0.0.0.0:29092,PLAINTEXT_HOST://0.0.0.0:9094,CONTROLLER://0.0.0.0:29093" # PLAINTEXT per i client (producer/consumer), CONTROLLER per la comunicazione interna del cluster
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: "PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT,CONTROLLER:PLAINTEXT"
      KAFKA_ADVERTISED_LISTENERS: "PLAINTEXT://broker_3:29092,PLAINTEXT_HOST://localhost:9094" # indirizzo che i client useranno per connettersi
      KAFKA_CONTROLLER_LISTENER_NAMES: "CONTROLLER" # specifica quale listener è usato per il ruolo di controller
      KAFKA_INTER_BROKER_LISTENER_NAME: "PLAINTEXT" # specifica quale listener è usato per la comunicazione tra broker
      # parametri per il controllo dei topic interni di Kafka
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 3
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 3
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 2 # minimo numero di repliche in sync
      CLUSTER_ID: "abcdefghijklmnopqrstuv" # identificatore univoco del cluster KRaft
    restart: unless-stopped # il broker si riavvia automaticamente se si arresta in modo anomalo

  kafka_ui:
    image: provectuslabs/kafka-ui:latest # immagine Docker di Kafka UI
    container_name: kafka_ui
    ports:
      - "8080:8080" # mappa la porta 8080 del container alla porta 8080 della macchina host
    environment:
      KAFKA_CLUSTERS_0_NAME: "local-3broker" # nome del cluster Kafka visualizzato in Kafka UI
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: "broker_1:29092,broker_2:29092,broker_3:29092" # indirizzi dei broker Kafka nel cluster
    depends_on:
      - broker_1
      - broker_2
      - broker_3


  producer_1:
    build: ./producer # costruisce l'immagine Docker per il producer partendo dal Dockerfile nella cartella ./producer
    container_name: producer_1
    depends_on:
      - broker_1 # assicura che il servizio Kafka sia avviato prima del producer
      - broker_2
      - broker_3
    environment:
      BOOTSTRAP_SERVERS: "broker_1:29092,broker_2:29092,broker_3:29092" # indirizzo del broker Kafka
      TOPIC_NAME: "test_partitions_3"   # va cambiato ad ogni test
      PARTITION_COUNT: "3" # numero di partizioni del topic
      RUN_ID: "test_p3" # identificatore univoco per l'esecuzione del test
      PAYLOAD_SIZE_BYTES: "200" # dimensione del payload in byte
      NB_MESSAGES_PER_BATCH: "10" # numero di messaggi per batch
      CONTAINER_NAME: "producer_1"
    volumes:
      - ./data:/app/data # monta la cartella locale ./data nella cartella /app/data del container per salvare i CSV localmente

  producer_2:
    build: ./producer # costruisce l'immagine Docker per il producer partendo dal Dockerfile nella cartella ./producer
    container_name: producer_2
